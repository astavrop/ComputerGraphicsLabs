name: C++ geometry tests
on:
  push:
  pull_request:
jobs:
  math-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (headless)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLAB03_BUILD_GRAPHICS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
